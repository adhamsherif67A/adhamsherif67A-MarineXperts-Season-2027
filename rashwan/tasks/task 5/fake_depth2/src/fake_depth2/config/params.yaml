depth_sensor_node:
  ros__parameters:
    publish_rate_hz: 5.0
    mode: "sine"          # "sine" or "random"
    baseline_depth: 10.0
    amplitude: 5.0
    period_s: 20.0
    noise_stddev: 0.05
    warn_threshold: 12.0
    zero_offset: 0.0
    frame_id: "depth_sensor_link"
    default_dive_rate: 0.5
    dive_control_hz: 10.0
    dive_goal_tolerance: 0.05

depth_monitor_node:
  ros__parameters:
    depth_threshold: 12.0
